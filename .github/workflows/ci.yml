name: Verify Undercity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated content is current
        run: node scripts/build-content.mjs --check
      - name: Verify supplemental JSON content is current
        run: node scripts/build-second-acts.mjs --check
      - name: Verify all three late main ambition JSON bundles
        run: node scripts/build-late-main.mjs --check
      - name: Verify approved CMS publication bundle
        run: node tools/cms/build.mjs --check && node --check tools/cms/app.js
      - name: Validate all authored stories and references
        run: node scripts/validate-content.mjs
      - name: Verify the content tracker
        run: node scripts/content-tracker.mjs --check
      - name: Validate Narrative Studio packets and review sign-off
        run: npm run studio:validate
      - name: Static and interactive engine tests
        run: node --test tests/*.test.mjs
