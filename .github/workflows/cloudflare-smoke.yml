name: Alternative playtest HTTP check
on:
  push:
    branches: [main]
    paths: [.github/workflows/cloudflare-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Cloudflare Worker game entrypoint
        env:
          URL: https://undercity-playtest.parris-neathaustralia.workers.dev
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 4 --max-time 30 -D /tmp/undercity-headers -o /tmp/undercity-index "$URL/"
          grep -q 'The Undercity' /tmp/undercity-index
          grep -q 'content/ambitions.js' /tmp/undercity-index
          # Confirm the public Worker serves the tested action-result experience.
          grep -Fq 'function focusGameView' /tmp/undercity-index
          grep -Fq 'id="action-result"' /tmp/undercity-index
          grep -Fq 'id="open-storylet"' /tmp/undercity-index
          grep -qi 'x-undercity-revision: 2ff199670a6454e03089e5cfd0305f1601cbec39' /tmp/undercity-headers
          grep -qi 'text/html' /tmp/undercity-headers
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 4 --max-time 30 -o /tmp/undercity-ambitions "$URL/content/ambitions.js"
          grep -q 'UndercityExpansions' /tmp/undercity-ambitions
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 4 --max-time 30 -o /tmp/undercity-rules "$URL/src/game/rules.global.js"
          grep -q 'UndercityRules' /tmp/undercity-rules
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 4 --max-time 30 -o /tmp/undercity-late "$URL/content/late-ambitions.js"
          grep -q 'coalition' /tmp/undercity-late
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 4 --max-time 30 -o /tmp/undercity-late-json "$URL/content/storylets/ambitions/late-main.v1.json"
          grep -q 'ambition-main-collection' /tmp/undercity-late-json
          grep -qi 'x-undercity-revision' /tmp/undercity-headers
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 4 --max-time 30 -o /tmp/undercity-cms "$URL/tools/cms/"
          grep -q 'QBN Studio' /tmp/undercity-cms
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 4 --max-time 30 -o /tmp/undercity-cms-app "$URL/tools/cms/app.js"
          grep -q 'studio-core.js' /tmp/undercity-cms-app
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 4 --max-time 30 -o /tmp/undercity-cms-core "$URL/tools/cms/studio-core.js"
          grep -q 'freshRequirement' /tmp/undercity-cms-core
          echo "Confirmed the pinned 2ff1996 playtest revision, direct outcome and opportunity-card views, rules, story content and CMS."
