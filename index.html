.hero{border-bottom:1px solid #7a786a80;margin-bottom:30px;padding-bottom:27px}.hero h1{font-size:clamp(2.1rem,4vw,3.6rem);line-height:1.13;margin:11px 0 14px}.hero p{color:#d8d6cb;max-width:690px;font-size:1.08rem}.ornament{color:var(--gold);letter-spacing:.35em;margin:15px 0}.story{background:linear-gradient(130deg,#213036,#19262a);border:1px solid #62726b75;border-top:2px solid var(--gold);border-radius:6px;margin:15px 0;padding:24px 26px;box-shadow:0 8px 28px #00000014}.story h2{font-size:1.65rem;line-height:1.23;margin:6px 0 12px}.story p{color:#dadbd2;white-space:pre-line}.story .tag{font:600 .65rem system-ui,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:var(--blue)}.choice{display:block;text-align:left;width:100%;color:var(--ink);border:1px solid #66776e88;background:#172228;border-radius:5px;padding:14px 16px;margin-top:10px;transition:background .14s,border .14s}.choice:hover:enabled{background:#2c3e40;border-color:var(--gold)}.choice b{display:block;font-size:1rem;font-weight:normal;color:#f7e6c9}.choice .detail{display:block;color:var(--muted);font:.79rem/1.55 system-ui,sans-serif;margin-top:5px}.choice .odds{color:var(--blue)}.choice:disabled b{color:#b1b2a7}.btn{background:#a9834e;color:#10191c;border:1px solid #d9be8d;padding:11px 16px;border-radius:4px;font:700 .85rem system-ui,sans-serif}.btn:hover{background:#e5c78f}.outline{background:transparent;color:var(--ink);border:1px solid #8b9c96}.outline:hover{background:#2b393f}.tiny{font-size:.72rem;padding:6px 9px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.mapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.maptile{padding:17px;background:#1a292e;border:1px solid #526660;border-radius:5px;position:relative}.maptile.here{border:2px solid var(--gold)}.maptile h3{font-size:1.26rem;margin:7px 0}.maptile p{font-size:.87rem;color:var(--muted);margin:0 0 12px}.maptile .mapnote{color:var(--gold);font:600 .73rem system-ui,sans-serif}.rule{height:1px;background:#52615e88;margin:24px 0}.hand{display:grid;gap:10px}.cardmini{border:1px solid #77746480;border-radius:5px;background:#243035;padding:13px}.cardmini h3{font-size:1.08rem;margin:4px 0 6px}.cardmini p{font-size:.79rem;line-height:1.45;color:var(--muted);margin-bottom:8px}.cardmini button{width:100%}.log{padding:12px 16px;border-left:2px solid #9b8c70;margin:10px 0;background:#1d2c30}.log small{display:block;margin-top:4px}.statline{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #64736a40;gap:15px}.muted{color:var(--muted)}.footnote{max-width:1400px;margin:0 auto;border-top:1px solid #51635c;padding:16px 22px;font:.76rem system-ui,sans-serif;color:var(--muted)}.notice{background:#25363b;border-left:3px solid var(--blue);padding:13px 15px;margin:14px 0;color:var(--ink)}.warning{border-color:var(--red)}.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}.intro{max-width:620px;margin:6vh auto}.intro h1{font-size:clamp(2.6rem,6vw,4.5rem);line-height:1.05}.intro .story{margin-top:24px}.sticker{display:inline-block;border:1px solid #6e876e80;padding:2px 7px;border-radius:4px;font:700 .64rem system-ui,sans-serif;color:#b5c7b7}.empty{padding:28px;border:1px dashed #6b756d;border-radius:5px;color:var(--muted)}#mobilemenu{display:none}.skyline{width:100%;height:125px;border:1px solid #52655f;background:radial-gradient(ellipse at 48% 110%,#4b7774 0%,#233f42 35%,#172328 70%);position:relative;overflow:hidden;margin:14px 0 24px}.skyline:after{content:"";position:absolute;bottom:0;left:0;right:0;height:58%;background:linear-gradient(150deg,transparent 18%,#141e23 18% 22%,transparent 22%),linear-gradient(33deg,transparent 30%,#111b20 30% 45%,transparent 45%),repeating-linear-gradient(90deg,#10171c 0 15px,#28393b 15px 20px,#111b20 20px 49px);clip-path:polygon(0 65%,8% 57%,9% 20%,13% 20%,15% 55%,24% 50%,25% 0,28% 0,30% 48%,40% 57%,41% 32%,45% 32%,48% 52%,55% 40%,57% 10%,61% 10%,64% 44%,71% 54%,74% 27%,78% 27%,81% 58%,90% 60%,93% 15%,96% 15%,99% 48%,100% 63%,100% 100%,0 100%)}.skyline:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 75%,#e5c17a 1px,transparent 2px),radial-gradient(circle at 60% 72%,#abddbd 2px,transparent 3px),radial-gradient(circle at 82% 86%,#e5c17a 1px,transparent 3px);z-index:1}.paneltitle{font-size:1.15rem;border-bottom:1px solid #52615e; padding-bottom:9px}textarea{width:100%;background:#0e181c;color:var(--ink);border:1px solid #5a726a;border-radius:5px;padding:10px;min-height:95px}

<script>
"use strict";
(function(){
const SAVE="the-undercity-v1", MAXA=10, REGEN=600000, CARDRATE=240000;
const STATS={observation:"Observation",guile:"Guile",persuasion:"Persuasion",resolve:"Resolve"};
const FACTIONS={"ledger":["The Velvet Ledger","Brokers of secrets and carefully phrased blackmail."],"wardens":["The Ash Wardens","Hunters who guard the roofs against things that climb."],"choir":["The Thorn Assembly","Artists who claim beauty can break a tyrant."],"hands":["The Copper Hands","Scavengers, smugglers and makers of necessary trouble."],"dawn":["The Dawnless Collective","Reformers determined to unseat the faceless Council."]};
const PLACES={
cell:{name:"The Bell-Cage",subtitle:"A prison hanging above the city",desc:"The bells have not rung in a century. The prisoners hear them anyway.",adj:[]},
court:{name:"Lantern Court",subtitle:"The heart of the Undercity",desc:"The city gathers here beneath a chandelier of cultivated moon-moss. Couriers argue, vendors whisper, and an empty plinth waits for a statue that has not yet been born.",adj:["ink","quays","market","choir","soot"]},
ink:{name:"The Inkward",subtitle:"Libraries and forbidden records",desc:"Miles of paper rest beneath stone vaults. Every book is chained, and every chain has a librarian.",adj:["court","stairs"]},
quays:{name:"Brinehook Quays",subtitle:"A river that runs into stone",desc:"Barges creak on the black Siltway. No vessel has ever reached the far bank; the bargemen insist there is one.",adj:["court","soot","stairs"]},
soot:{name:"The Sootworks",subtitle:"Furnaces beneath the streets",desc:"Ironworks roar through a perpetual midnight. The factory clocks all disagree about the date.",adj:["court","quays","stairs"]},
choir:{name:"The Moss Choir",subtitle:"Gardens where memory blooms",desc:"Under blue-gold spores, horticulturists tend flowers that bloom with voices borrowed from the dead.",adj:["court","market"]},
market:{name:"The Glass Arcade",subtitle:"A thousand things for sale",desc:"Glass lamps cast a borrowed dawn on stalls selling tools, reputations and counterfeit memories.",adj:["court","choir"]},
stairs:{name:"The Forgotten Stairs",subtitle:"Beneath the foundations",desc:"There are thirteen hundred steps here. The builders remembered only twelve hundred.",adj:["ink","quays","soot","edge"],locked:"Two leads in the Investigation",unlock:s=>s.clues>=2},
edge:{name:"The Listening Edge",subtitle:"Where the cavern listens back",desc:"Here the city gives way to a depth without a floor. Something within it breathes when you speak.",adj:["stairs"],locked:"Four leads in the Investigation",unlock:s=>s.clues>=4},
watch:{name:"The Office of Second Chances",subtitle:"A custody ward",desc:"A kindly clerk explains that mercy is a procedure, not an inclination.",adj:[]},
ward:{name:"The Quiet Ward",subtitle:"A hospital for mind and body",desc:"The physician offers you an inventory of your injuries, including several you do not remember receiving.",adj:[]},
tribunal:{name:"The Unspoken Tribunal",subtitle:"A hearing conducted without speech",desc:"Your name is being argued over by people who have never met you.",adj:[]}
};
const ITEMS={brass:"A key without teeth",charcoal:"Charcoal rubbing",silk:"A ribbon of coded silk",hook:"Folded brass hook",badge:"Warden's broken badge",ticket:"An undated ferry ticket",glass:"A warm glass bead",ledger:"An unburnt page",moss:"Singing moss",lure:"A listening-stone",map:"The surveyor's map",relic:"A clock with no hands"};
const CARDS=[
{id:"card_bell",title:"The bell that refuses to ring",desc:"A child sells you the silence between two bells.",weight:3,choices:[{label:"Buy a pocket of silence",desc:"2 pennies, +1 Sanity.",need:{coin:2},effects:{coin:-2,sanity:1},success:"You pay for nothing at all. It is the first honest sale of the day."},{label:"Ask where the bell is buried",stat:"observation",difficulty:6,effects:{coin:2,clues:1},fail:{sanity:-1},success:"The child draws a map on your palm. The ink is yours.",failure:"The child looks past your shoulder. The bell begins inside your head."}]},
{id:"card_courier",title:"A courier without a face",desc:"A letter addresses you in handwriting you have not learned yet.",weight:3,choices:[{label:"Open the letter",effects:{clues:1,notoriety:1},success:"Inside is a photograph of you standing at the city's edge. The date is tomorrow."},{label:"Return it to its sender",stat:"guile",difficulty:6,effects:{coin:5},fail:{suspicion:1},success:"The courier pays you to forget where you saw it.",failure:"Someone has already opened the letter in your name."}]},
{id:"card_worm",title:"The honest worm",desc:"A worm in a necktie offers legal advice from a crack in the pavement.",weight:2,choices:[{label:"Hear its case",effects:{coin:2,sanity:1},success:"The worm wins its case against the rain. You receive a modest fee."},{label:"Ask about the Council",stat:"persuasion",difficulty:7,effects:{clues:1},fail:{notoriety:1},success:"The worm admits that the Council is older than the laws it cites.",failure:"The worm invokes client confidentiality, and a passer-by recognises you."}]},
{id:"card_market",title:"A magnificent forgery",desc:"You find a mirror showing someone else's childhood.",weight:3,choices:[{label:"Sell the mirror's reflection",effects:{coin:4,sanity:-1},success:"The dealer takes your reflection. For the next hour, you look slightly unfinished."},{label:"Break the mirror",stat:"resolve",difficulty:6,effects:{sanity:2},fail:{health:-1},success:"The false childhood falls into bright, harmless pieces.",failure:"The mirror breaks you just enough to hurt."}]},
{id:"card_warden",title:"The rooftop oath",desc:"An Ash Warden mistakes you for a long-expected recruit.",weight:2,choices:[{label:"Take a watch",stat:"resolve",difficulty:6,effects:{coin:4,relation:{wardens:1}},fail:{health:-2},success:"For one watch the roofs are quiet. The Warden pays you and salutes.",failure:"The thing on the roof is faster than an oath."},{label:"Trade gossip",effects:{coin:1,clues:1,notoriety:1},success:"You learn that the roof-beasts flee from a voice beneath the city."}]},
{id:"card_poet",title:"The poet who rents out endings",desc:"A poet offers to edit the worst day of your life.",weight:2,choices:[{label:"Decline the revision",effects:{sanity:1,coin:2},success:"The poet charges for restraint. You pay with a memory they do not want."},{label:"See how it might have ended",stat:"observation",difficulty:7,effects:{clues:1,sanity:-1},fail:{sanity:-2},success:"You recognise a Council seal on the page of your possible life.",failure:"The ending is merciful. That is what makes it cruel."}]},
{id:"card_smuggler",title:"A purse stitched shut",desc:"A smuggler needs someone who can keep a secret and hold a needle.",weight:3,choices:[{label:"Mend the purse",stat:"guile",difficulty:5,effects:{coin:6,relation:{hands:1}},fail:{suspicion:1},success:"You discover a hidden coin and return it. The smuggler pays you twice.",failure:"You pierce a packet of powder. The watch can smell it."},{label:"Turn it over to the watch",effects:{coin:2,notoriety:1},success:"You are paid for civic virtue and distrusted for it."}]},
{id:"card_moss",title:"A voice in the moss",desc:"A flower hums a name you were never told.",weight:4,choices:[{label:"Listen without interrupting",stat:"persuasion",difficulty:6,effects:{clues:1,sanity:1},fail:{sanity:-1},success:"The flower says the city was once promised to someone still descending.",failure:"The flower remembers your last breath, although you are standing here."},{label:"Collect a cutting",effects:{items:{moss:1},sanity:-1},success:"The moss curls into a careful imitation of your handwriting."}]}
];
const STORIES=[
{id:"ambition1",where:["court"],title:"The clockmaker's impossible appointment",description:"A one-eyed clockmaker calls you by a name no one here knows. She has kept an appointment for you for eleven years. On the table between you sits a clock without hands.",when:s=>s.ambition===0,choices:[{label:"Take the clock and the commission",desc:"Begin the main story: Who sealed the city?",effects:{ambition:1,items:{relic:1},coin:3},success:"'Find the ledger that records the hour the sky was closed,' she says. 'Begin in the Inkward. Ask after the Unburnt Page.'"}]},
{id:"ambition2",where:["ink"],title:"The page that survived the fire",description:"The Unburnt Page was catalogued as a blank sheet. The library's oldest attendant remembers a night when every clock struck thirteen, although the thirteenth hour is not permitted.",when:s=>s.ambition===1,choices:[{label:"Trace the page's watermark",stat:"observation",difficulty:5,effects:{ambition:1,items:{ledger:1},clues:1},fail:{sanity:-1},success:"In the watermark is a plan of the Forgotten Stairs. One line reads: 'The door has a voice.'",failure:"The letters run away from the light. You can come back and try again."},{label:"Persuade the attendant to translate it",stat:"persuasion",difficulty:5,effects:{ambition:1,items:{ledger:1},notoriety:1},fail:{suspicion:1},success:"The attendant reads aloud a map the page is too frightened to show. They demand you never mention their name.",failure:"The attendant insists the page is blank. Perhaps you asked too loudly."}]},
{id:"ambition3",where:["stairs"],title:"The door built for an absent hour",description:"Halfway down the stairs, a brass door opens only when all thirteen bells are silent. The handless clock has begun to tick within your coat.",when:s=>s.ambition===2,choices:[{label:"Listen between the bells",stat:"resolve",difficulty:6,effects:{ambition:1,items:{lure:1},clues:1},fail:{sanity:-2},success:"Behind the door you hear a city-sized heartbeat. You are told to carry the listening-stone to the Edge.",failure:"The bells drown out the instruction. Their echo follows you upstairs."},{label:"Pick the silent lock",stat:"guile",difficulty:6,effects:{ambition:1,items:{lure:1},clues:1},fail:{health:-1,suspicion:1},success:"You steal a moment from the clock. Inside it is the stone you need.",failure:"The lock twists in your hand. You retreat before the wardens arrive."}]},
{id:"ambition4",where:["edge"],title:"A city that remembers",description:"You lift the listening-stone. Below, the depth answers with your own voice, asking whether the Undercity should be reminded of what it has forgotten. Every bell waits.",when:s=>s.ambition===3,choices:[{label:"Let the city remember",effects:{ambition:4,flag:"remember",sanity:-2,notoriety:2},success:"Across the Undercity, old names return to waking minds. The Council's silence is broken. The world is not saved; it is changed, and it will remember that you were here."},{label:"Keep the city's oldest secret",effects:{ambition:4,flag:"silence",coin:20,sanity:2},success:"You seal the chamber without sealing the truth in your own heart. A thousand people sleep peacefully. A thousand more questions await another day."}]},
{id:"court_market",where:["court"],title:"The lamp-lighter's bargain",description:"Old Eda trims lamps that do not burn oil. She says the eastern glassworks have begun selling daylight in bottles.",choices:[{label:"Help her carry the lamps",stat:"resolve",difficulty:5,effects:{coin:4,relation:{wardens:1}},fail:{health:-1},success:"Eda tells you there is a second city beneath this one. She pays you in reliable pennies.",failure:"A lamp slips. You save the flame and burn your hand."},{label:"Ask why she fears the eastern light",stat:"persuasion",difficulty:6,effects:{clues:1},fail:{notoriety:1},success:"'Because it shines up,' Eda whispers. 'And something shines down in answer.'",failure:"Eda looks at your unfamiliar face. That is answer enough."}]},
{id:"court_bread",where:["court"],title:"The baker's invisible queue",description:"The baker keeps a ledger for customers who have not yet been born. Today's queue is unusually long.",choices:[{label:"Carry loaves to the poor",effects:{coin:2,notoriety:-1,health:1},success:"You are paid in crumbs and trust, both more valuable than you expected."},{label:"Read the ledger when the baker turns",stat:"guile",difficulty:6,effects:{clues:1,coin:3},fail:{suspicion:1},success:"One entry bears the handwriting of the Council. It orders twelve loaves for the Edge.",failure:"The baker slaps your wrist. Her flour remembers your fingerprints."}]},
{id:"court_news",where:["court"],title:"A proclamation with no author",description:"A notice claims the Council will announce a new law at the thirteenth hour. No-one remembers there being thirteen hours.",once:false,choices:[{label:"Read it aloud",effects:{notoriety:1,coin:2},success:"An audience gathers. Someone tips you to stop before the last sentence."},{label:"Follow its paper trail",stat:"observation",difficulty:5,effects:{clues:1},fail:{sanity:-1},success:"The paper was made from the same moss used to seal the Forgotten Stairs.",failure:"The notice crumbles; your headache remains."}]},
{id:"ink_catalogue",where:["ink"],title:"The catalogue of absent books",description:"Archivist Morrow maintains a shelf where every title has been scraped away. You are certain one volume has your name on its spine.",choices:[{label:"Cross-reference the blank volumes",stat:"observation",difficulty:6,effects:{clues:1,items:{charcoal:1}},fail:{sanity:-1},success:"Your rubbing reveals a route to the lower foundations. The archivist insists it was always there.",failure:"The index sends you in circles. You begin to suspect circles are the point."},{label:"Offer to reshelve books",effects:{coin:4,relation:{ledger:1}},success:"You earn a few pennies and the librarian's cautious regard."}]},
{id:"ink_footnote",where:["ink"],title:"A footnote that watches you",description:"At the bottom of an apparently dry census, a handwritten footnote moves whenever you are not looking.",once:true,choices:[{label:"Pin it beneath glass",stat:"resolve",difficulty:6,effects:{items:{glass:1},clues:1},fail:{sanity:-2},success:"The footnote spells a warning: 'Do not answer the thirteenth bell.'",failure:"The note crawls into your shadow. You may seek it again later."},{label:"Copy the warning",effects:{clues:1,coin:1},success:"The letters continue to shift on the copy, but only when you blink."}]},
{id:"ink_work",where:["ink"],title:"A night among the ledgers",description:"A clerk offers a tedious but discreet shift indexing estate records.",choices:[{label:"Complete the shift",effects:{coin:5,health:-1},success:"You leave with wages, paper cuts, and a better understanding of the city's hunger."},{label:"Search for the sealed accounts",stat:"guile",difficulty:6,effects:{clues:1,coin:3},fail:{suspicion:2},success:"A transfer to 'the Mouth' appears in the Council's accounts.",failure:"You hear the clerk's footsteps behind you."}]},
{id:"quay_boat",where:["quays"],title:"The boat that came back empty",description:"The ferry Nettle has returned from downstream with no crew and six extra pairs of boots.",choices:[{label:"Search the ferry",stat:"observation",difficulty:6,effects:{coin:4,clues:1,items:{ticket:1}},fail:{sanity:-1},success:"Each boot contains an undated ticket. All are stamped: 'ONE WAY IN.'",failure:"The cabin smells of someone's last idea."},{label:"Tow it to shore",stat:"resolve",difficulty:5,effects:{coin:5,relation:{hands:1}},fail:{health:-2},success:"You rescue the boat, though none of the crew. A ferryman pays you.",failure:"The current pulls at your ribs. You stagger back to the quay."}]},
{id:"quay_fisher",where:["quays"],title:"The fisherman who catches questions",description:"An old man casts a hook into the dark river. He says he catches questions and sells the answers separately.",choices:[{label:"Buy a question",need:{coin:3},effects:{coin:-3,clues:1},success:"He pulls up a wet scrap: 'WHO CLOSED THE SKY?' The answer remains for sale."},{label:"Help mend his nets",effects:{coin:4},success:"You discover that woven silence makes a better net than rope."}]},

const EXT=window.UndercityExpansions||{stories:[],cards:[],items:{},professions:[],destinies:[]};
Object.assign(ITEMS,EXT.items||{});STORIES.push(...(EXT.stories||[]));CARDS.push(...(EXT.cards||[]));
const PROFESSIONS=EXT.professions||[],DESTINIES=EXT.destinies||[],WEEK=604800000;
function actionCap(){return Object.values(state?.renown||{}).reduce((n,v)=>n+(Number(v)||0),0)>=14?20:MAXA;}
function fresh(){return{version:1,stage:"welcome",tab:"story",name:"Stranger",background:"",faction:"",place:"cell",actions:MAXA,lastTick:Date.now(),lastCard:Date.now(),playtest:false,coin:8,stats:{observation:10,guile:10,persuasion:10,resolve:10},suspicion:0,notoriety:0,health:10,sanity:10,clues:0,ambition:0,items:{},relation:{ledger:0,wardens:0,choir:0,hands:0,dawn:0},flags:{},done:{},hand:["card_bell","card_courier"],journal:[],result:null,selectedCard:null,originChoice:"",path:"",pathProgress:0,pathEnding:"",renown:{observation:0,guile:0,persuasion:0,resolve:0},quirks:{},extras:{},profession:"",lastWage:Date.now(),destiny:""}}
let state;
function normaliseSave(v){
 const b=fresh();if(!v||v.version!==1||!v.stats||!PLACES[v.place])return b;
 Object.assign(b,v);
 b.stats={...fresh().stats,...(v.stats||{})};
 b.renown={observation:0,guile:0,persuasion:0,resolve:0,...(v.renown||{})};
 b.quirks={...(v.quirks||{})};b.extras={...(v.extras||{})};
 b.flags={...(v.flags||{})};b.relation={...fresh().relation,...(v.relation||{})};
 b.items={...(v.items||{})};b.done={...(v.done||{})};
 b.hand=Array.isArray(v.hand)?v.hand.filter(k=>CARDS.some(c=>c.id===k)).slice(0,6):fresh().hand;
 b.journal=Array.isArray(v.journal)?v.journal.slice(0,80):[];
 b.path=EXT.ambitions?.some(p=>p.id===v.path)?v.path:"";
 b.pathProgress=Math.max(0,Math.min(8,Number(v.pathProgress)||0));
 b.actions=Math.max(0,Math.min(20,Number(v.actions)||0));b.lastWage=Number(v.lastWage)||Date.now();
 b.profession=PROFESSIONS.some(p=>p.id===v.profession)?v.profession:"";
 b.destiny=DESTINIES.some(d=>d.id===v.destiny)?v.destiny:"";return b;
}
try{state=normaliseSave(JSON.parse(localStorage.getItem(SAVE)))}catch(e){state=fresh()}
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function lv(cp){return Math.floor((Math.sqrt(8*Math.max(0,cp||0)+1)-1)/2)}
function odds(stat,d){const v=lv(state.stats[stat]||0);return d<=0?100:Math.min(100,Math.max(10,Math.floor(.60*v/d*100)))}
function labelStat(stat){return STATS[stat]||stat}
function addJournal(t){state.journal.unshift({text:t,date:new Date().toISOString(),place:state.place});state.journal=state.journal.slice(0,80)}
function tick(){
 const now=Date.now(),cap=actionCap();
 if(now<state.lastTick)state.lastTick=now;
 if(state.actions>=cap)state.lastTick=now;
 else {const n=Math.max(0,Math.floor((now-state.lastTick)/REGEN));
   if(n>0){state.actions=Math.min(cap,state.actions+n);state.lastTick+=n*REGEN;}}
 if(now<state.lastCard)state.lastCard=now;
 const draws=Math.max(0,Math.floor((now-state.lastCard)/CARDRATE));
 if(draws>0){state.lastCard+=draws*CARDRATE;for(let i=0;i<Math.min(6,draws);i++)drawCard();}
 if(state.profession){const job=PROFESSIONS.find(p=>p.id===state.profession);
   if(job){if(!Number.isFinite(state.lastWage)||state.lastWage>now)state.lastWage=now;
    const n=Math.max(0,Math.min(52,Math.floor((now-state.lastWage)/WEEK)));
    if(n>0){state.coin+=n*job.wage;state.lastWage+=n*WEEK;addJournal("Earned "+(n*job.wage)+" pennies for "+n+" week(s) as "+job.name+".");}}}
}
function canPlay(c){if((c.cost==null?1:c.cost)>state.actions&&!state.playtest)return false;if(c.need){if(c.need.coin!=null&&state.coin<c.need.coin)return false;if(c.need.item&&!state.items[c.need.item])return false}return true}
function drawCard(){if(state.stage!=="explore"||state.hand.length>=6)return false;let list=CARDS.filter(c=>!state.hand.includes(c.id));if(!list.length)return false;let weight=list.reduce((a,c)=>a+c.weight,0);let r=Math.random()*weight;let chosen=list.find(c=>(r-=c.weight)<=0)||list[0];state.hand.push(chosen.id);return true}
function apply(e){
 if(!e)return;if(e.coin)state.coin=Math.max(0,state.coin+Number(e.coin));
 for(const k of ["suspicion","notoriety","health","sanity","clues","ambition","pathProgress"])
   if(e[k]!=null)state[k]=Math.max(0,(state[k]||0)+Number(e[k]));
 state.health=Math.min(10,state.health);state.sanity=Math.min(10,state.sanity);
 state.suspicion=Math.min(8,state.suspicion);state.notoriety=Math.min(8,state.notoriety);
 if(e.items)for(const k in e.items)state.items[k]=Math.max(0,(state.items[k]||0)+e.items[k]);
 if(e.relation)for(const k in e.relation)state.relation[k]=(state.relation[k]||0)+e.relation[k];
 if(e.renown)for(const k in e.renown)state.renown[k]=(state.renown[k]||0)+e.renown[k];
 if(e.quirks)for(const k in e.quirks)state.quirks[k]=(state.quirks[k]||0)+e.quirks[k];
 if(e.extras)for(const k in e.extras)state.extras[k]=(state.extras[k]||0)+e.extras[k];
 if(e.path&&!state.path)state.path=e.path;
 if(e.pathEnding)state.pathEnding=e.pathEnding;
 if(e.flag)state.flags[e.flag]=true;
}
function penalty(){if(["ward","watch","tribunal"].includes(state.place))return;if(state.suspicion>=8){state.recoveryFrom=state.place;state.place="watch";addJournal("The night office has arrested you for excessive curiosity.")}else if(state.notoriety>=8){state.recoveryFrom=state.place;state.place="tribunal";addJournal("The Unspoken Tribunal has summoned you.")}else if(state.health<=0||state.sanity<=0){state.recoveryFrom=state.place;state.place="ward";addJournal("You wake in the Quiet Ward. Recovery is possible, though it has a price.")}}
function recover(which){if(!spend(1))return;let old=state.place;if(old==="watch"){state.suspicion=Math.max(0,state.suspicion-3);state.coin=Math.max(0,state.coin-1)}else if(old==="tribunal"){state.notoriety=Math.max(0,state.notoriety-3);state.coin=Math.max(0,state.coin-2)}else{state.health=Math.max(4,state.health);state.sanity=Math.max(4,state.sanity);state.coin=Math.max(0,state.coin-2)}state.place=PLACES[state.recoveryFrom]?state.recoveryFrom:"court";state.result={title:"A costly return",text:"You return to the streets. Your absence was noticed. No-one seems surprised.",note:"The ward was a detour, not a game over."};addJournal("Recovered from "+PLACES[old].name);done()}
function spend(n){tick();if(!state.playtest&&state.actions<n)return false;if(!state.playtest)state.actions-=n;return true}
function completed(id){return !!state.done[id]}
function isVisible(st){return st.where.includes(state.place)&&(!st.when||st.when(state))&&(!st.once||!completed(st.id))}
function choose(id,ix,card){tick();let st=(card?CARDS:STORIES).find(s=>s.id===id);if(!st)return;if(card){if(!state.hand.includes(id)||state.stage!=="explore")return}else if(!isVisible(st))return;let c=st.choices[ix];if(!c||!canPlay(c))return;let cost=c.cost==null?1:c.cost;if(!spend(cost))return;let success=true,chance=null;if(c.stat){chance=odds(c.stat,c.difficulty);success=Math.random()*100<chance;state.stats[c.stat]=(state.stats[c.stat]||0)+(success?(chance<80?2:1):1)}let effects=success?c.effects:c.fail;apply(effects);if(success&&c.rare&&Math.random()<.04)apply(c.rare);if(card){state.hand=state.hand.filter(x=>x!==id);state.selectedCard=null}else if(success||!c.stat)state.done[id]=true;let outcome=success?(c.success||"The city accepts your choice, though not without recording it."):(c.failure||"The city will allow you to try again. It is less generous about the price.");state.result={title:st.title,text:outcome,note:(success?"SUCCESS":"SETBACK")+(chance!==null?" · "+chance+"% chance":"")+(c.stat?" · +experience in "+labelStat(c.stat):"")};addJournal(st.title+": "+outcome);penalty();state.tab="story";done()}
function done(){save();render()}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(state))}catch(e){console.warn("Local save unavailable",e)}}
function setTab(t){state.tab=t;state.result=null;state.selectedCard=null;done()}
function travel(p){if(state.stage!=="explore"||!PLACES[p]||["watch","ward","tribunal","cell"].includes(p))return;let current=PLACES[state.place];if(!current||!current.adj.includes(p))return;let to=PLACES[p];if(to.unlock&&!to.unlock(state))return;state.place=p;state.result={title:"You arrive at "+to.name,text:to.desc,note:"Travelling is free. You can return along the same route."};addJournal("Arrived at "+to.name);state.tab="story";done()}
function beginOrigin(bg){state.background=bg;let stat={scribe:"observation",runner:"guile",speaker:"persuasion",sentinel:"resolve"}[bg];state.stats[stat]+=5;state.stage="allegiance";done()}
function beginFaction(f){if(!FACTIONS[f])return;state.faction=f;state.relation[f]=2;state.stage="escape";done()}
function escapeCell(path){let info={observation:["charcoal","ink"],guile:["hook","quays"],persuasion:["silk","choir"],resolve:["badge","soot"]}[path];if(!info)return;state.stats[path]+=4;state.items[info[0]]=1;state.stage="explore";state.place=info[1];state.result={title:"Beyond the Bell-Cage",text:"You take your freedom through the city's high maintenance galleries and arrive in "+PLACES[info[1]].name+". The Bell-Cage sounds once behind you. Nobody looks up.\n\nLantern Court is one connected road away. Go there to meet the clockmaker and begin your main mystery. The City map shows every district, the connecting roads and what is locked."+(state.tutorial?"\n\nTIP: Story choices display their cost and success odds. You can travel for free, and Settings offers a faster playtest mode.":""),note:"Escape route: "+labelStat(path)+" · Starting item: "+ITEMS[info[0]]};addJournal("You escaped the Bell-Cage by "+labelStat(path).toLowerCase()+".");done()}
function chooseCard(id){if(state.hand.includes(id)){state.selectedCard=id;state.result=null;state.tab="story";done()}}
function buyDraw(){tick();if(state.hand.length>=6)return;if(!state.playtest&&state.coin<2)return;if(!state.playtest)state.coin-=2;drawCard();done()}
function totalProgress(){return Math.min(100,Math.round(state.clues/4*100))}
function box(title,text){return '<div class="notice"><b>'+esc(title)+'</b> '+esc(text)+'</div>'}
function renderTop(){let cap=actionCap();let till=Math.max(0,REGEN-(Date.now()-state.lastTick));let min=String(Math.floor(till/60000)).padStart(2,"0"),sec=String(Math.floor(till%60000/1000)).padStart(2,"0");$("topstats").innerHTML='<span>✧ PENNIES <strong>'+state.coin+'</strong></span><span>◷ ACTIONS <strong>'+state.actions+'/'+cap+'</strong> '+(state.actions<cap?'<span id="countdown">+'+min+':'+sec+'</span>':'<span>Full</span>')+'</span><span>✦ LEADS <strong>'+state.clues+'</strong></span>'+(state.playtest?'<span class="sticker">PLAYTEST</span>':'')}
function renderNav(){let tabs=[["story","Story"],["map","City map"],["myself","Myself"],["paths","Paths & callings"],["possessions","Possessions"],["journal","Journal"],["bazaar","Bazaar"],["help","How to play"],["settings","Settings"]];$("navigation").innerHTML='<div class="nav">'+tabs.map(a=>'<button class="'+(state.tab===a[0]?"active":"")+'" data-act="tab" data-target="'+a[0]+'">'+a[1]+'</button>').join("")+'</div>';let pl=PLACES[state.place];$("nearby").innerHTML=state.stage==="explore"&&pl.adj.length?pl.adj.map(p=>{let x=PLACES[p],locked=x.unlock&&!x.unlock(state);return '<button '+(locked?'disabled title="'+esc(x.locked)+'"':"")+' data-act="travel" data-target="'+p+'">'+esc(x.name)+'<small>'+(locked?'Locked · '+esc(x.locked):esc(x.subtitle))+'</small></button>'}).join(""):'<span class="small">Your journey begins beyond the Bell-Cage.</span>'}
function renderMenaces(){$("menaces").innerHTML=[["Health",state.health,10,false],["Sanity",state.sanity,10,false],["Suspicion",state.suspicion,8,true],["Notoriety",state.notoriety,8,true]].map(v=>'<div><span>'+v[0]+'</span><strong>'+v[1]+'/'+v[2]+'</strong></div><div class="meter '+(v[3]?'danger':'')+'"><b style="width:'+Math.round(v[1]/v[2]*100)+'%"></b></div>').join("")+'<small>High Suspicion or Notoriety (8), or Health/Sanity reaching zero, causes a recoverable detour.</small>'}
function renderHand(){let hand=state.hand.map(id=>CARDS.find(c=>c.id===id)).filter(Boolean);$("hand").innerHTML=state.stage==="explore"?(hand.length?hand.map(c=>'<div class="cardmini"><div class="eyebrow">Unexpected encounter</div><h3>'+esc(c.title)+'</h3><p>'+esc(c.desc)+'</p><button class="btn outline tiny" data-act="card" data-target="'+c.id+'">Read card →</button></div>').join(""):'<div class="empty">Your hand is empty. Cards return over time.</div>'):'<div class="empty">Your opportunity hand unlocks after the escape.</div>';$("handactions").innerHTML=state.stage==="explore"?'<button class="btn outline tiny" data-act="draw" '+(state.hand.length>=6?"disabled":"")+'>'+(state.playtest?"Draw a card (free playtest)":"Draw a card · 2 pennies")+'</button><div class="small" style="margin-top:7px">A free card arrives every 4 minutes. Max 6 cards.</div>':""}
function sceneIntro(){if(state.stage==="welcome")return '<section class="intro"><div class="eyebrow">A narrative journey into the dark</div><h1>THE <span style="color:var(--gold)">UNDERCITY</span></h1><div class="ornament">✦ ✦ ✦</div><div class="skyline" aria-hidden="true"></div><p>They say there was once a sky. Nobody in this city has seen it. Beneath a mountain of darkness, thousands of lamps hold back a silence with teeth.</p><p>You have come by the long descent, and woken in a hanging prison with no memory of the crime.</p><div class="story"><div class="eyebrow">Before the bells</div><h2>How would you like to begin?</h2><button class="choice" data-act="intro"><b>Show me how this works</b><span class="detail">Start with brief explanations of choices, checks and travel.</span></button><button class="choice" data-act="skip"><b>Let me discover it myself</b><span class="detail">Begin the story without the tutorial note.</span></button></div></section>';
if(state.stage==="origin")return '<div class="intro"><div class="eyebrow">Character · 1 of 3</div><h1>Who were you above?</h1><p>Perhaps the surface was real. Perhaps it was merely a story. Either way, you brought a habit of mind down with you.</p>'+box("Your background","Choose a strength. It grants starting experience and changes your approach to the city.")+'<div class="story">'+[["scribe","A keeper of records","Observation · You notice what others overlook."],["runner","A carrier of unsent letters","Guile · You know how to slip past a watchful eye."],["speaker","An advocate for lost causes","Persuasion · You can make a stranger hear you."],["sentinel","A guard who deserted","Resolve · You face what sensible people flee."]].map(a=>'<button class="choice" data-act="origin" data-target="'+a[0]+'"><b>'+a[1]+'</b><span class="detail">'+a[2]+'</span></button>').join("")+'</div></div>';
if(state.stage==="allegiance")return '<div class="intro"><div class="eyebrow">Character · 2 of 3</div><h1>Who might shelter you?</h1><p>The Undercity has five great factions. None is wholly good, and none welcomes a stranger without a price.</p><div class="story">'+Object.entries(FACTIONS).map(([k,v])=>'<button class="choice" data-act="faction" data-target="'+k+'"><b>'+esc(v[0])+'</b><span class="detail">'+esc(v[1])+'</span></button>').join("")+'</div></div>';
if(state.stage==="escape")return '<div class="intro"><div class="eyebrow">Character · 3 of 3</div><h1>The Bell-Cage</h1><div class="skyline" aria-hidden="true"></div><p>Your cell hangs like a rusted lantern from the cavern roof. Through its bars, you see the whole Undercity scattered below: blue moss, copper towers, and a distant depth that seems to watch you back.</p><p>The gaoler has left a single lamp burning. You must choose an escape, and discover what kind of person the city will think you are.</p><div class="story"><div class="eyebrow">The first choice · Free</div><h2>How will you reach the streets?</h2>'+[["observation","Study the bell's winding mechanism","Find a defect in the machinery and an overlooked service hatch."],["guile","Lift a key from the watch","Borrow the gaoler's shadow, then their tools."],["persuasion","Persuade the keeper to help","Convince the keeper that holding you here is a much greater risk."],["resolve","Climb the maintenance chains","Reach the lower platform by strength, nerve and a very long drop."]].map(a=>'<button class="choice" data-act="escape" data-target="'+a[0]+'"><b>'+a[1]+'</b><span class="detail">'+labelStat(a[0])+' · '+a[2]+'</span></button>').join("")+'</div></div>';
return ""}
function choiceHTML(st,card){return st.choices.map((c,i)=>{let success=c.stat?odds(c.stat,c.difficulty):null,can=canPlay(c),cost=c.cost==null?1:c.cost;let needs=c.need?(c.need.coin!=null?" · Requires "+c.need.coin+" pennies":c.need.item?" · Requires "+ITEMS[c.need.item]:""):"";return '<button class="choice" data-act="choose" data-target="'+st.id+'" data-index="'+i+'" data-card="'+(card?"1":"0")+'" '+(!can?"disabled":"")+'><b>'+esc(c.label)+'</b><span class="detail">'+(c.desc?esc(c.desc)+' · ':"")+(c.stat?'<span class="odds">'+labelStat(c.stat)+' · '+success+'% success</span> · ':'')+(cost===0?"Free":cost+" action")+(needs?esc(needs):"")+(can?"":" · Unavailable")+'</span></button>'}).join("")}
function renderStory(){if(state.stage!=="explore")return sceneIntro();let p=PLACES[state.place];let hero='<div class="hero"><div class="eyebrow">The Undercity / '+esc(p.subtitle)+'</div><h1>'+esc(p.name)+'</h1><p>'+esc(p.desc)+'</p><button class="btn outline tiny" data-act="tab" data-target="map">Explore the city map ↗</button></div>';if(state.result){let r=state.result;return hero+'<article class="story" role="status"><div class="tag">'+esc(r.note||"A consequence")+'</div><h2>'+esc(r.title)+'</h2><p>'+esc(r.text)+'</p><button class="btn" data-act="dismiss">Continue exploring →</button></article>'}
if(["ward","watch","tribunal"].includes(state.place))return hero+'<div class="story"><h2>Leave this place, changed</h2><p>You cannot explore other districts until you have endured the consequences. Recovery costs one action and some pennies. There is no permanent game over.</p><button class="choice" data-act="recover"><b>Accept your costly release</b><span class="detail">1 action · Reduce the menace and return to your previous district.</span></button></div>';
if(state.selectedCard){let c=CARDS.find(x=>x.id===state.selectedCard);if(c)return hero+'<div class="story"><div class="tag">Opportunity card</div><h2>'+esc(c.title)+'</h2><p>'+esc(c.desc)+'</p>'+choiceHTML(c,true)+'<button class="smallbtn" data-act="dismiss">← Keep this card for later</button></div>'}
let stories=STORIES.filter(isVisible),amb=stories.filter(x=>x.id.startsWith("ambition")),others=stories.filter(x=>!x.id.startsWith("ambition"));
let guidance=state.ambition===0?"Begin at Lantern Court: speak to the clockmaker.":state.ambition===1?"Follow the handless clock to the Inkward.":state.ambition===2?"Investigate two leads to open the Forgotten Stairs.":state.ambition===3?"Find four leads and descend to the Listening Edge.":"Your first ambition has reached a conclusion. The city still has secrets.";
let personal=!state.path?'<div class="notice"><div class="eyebrow">Choose a personal ambition</div>In Lantern Court, choose <strong>A question no clerk can answer</strong>. <button class="smallbtn" data-act="tab" data-target="paths">See paths →</button></div>':
 state.pathProgress<8?(()=>{const next=STORIES.find(x=>x.id==="path-"+state.path+"-"+(state.pathProgress+1)),which=EXT.ambitions?.find(a=>a.id===state.path);
  return next?'<div class="notice"><div class="eyebrow">Personal ambition · '+(state.pathProgress+1)+'/8</div>'+esc(which?.name||state.path)+': '+esc(next.title)+' at <strong>'+esc(PLACES[next.where[0]]?.name)+'</strong>. <button class="smallbtn" data-act="tab" data-target="map">Find the route →</button></div>':'';})():
 '<div class="notice"><div class="eyebrow">Personal ambition completed</div>'+esc(EXT.ambitions?.find(a=>a.id===state.path)?.name||state.path)+'</div>';
return hero+'<div class="notice"><div class="eyebrow">The city-wide investigation</div>'+esc(guidance)+' <button class="smallbtn" data-act="tab" data-target="map">See routes →</button></div>'+personal+'<div class="sectionhead"><h2 style="font-size:1.6rem">Stories here</h2><span class="small">'+stories.length+' available</span></div>'+amb.map(storyHTML).join("")+others.map(storyHTML).join("")+(!stories.length?'<div class="empty">You have heard the stories here for now. Travel to a neighbouring district, or draw an opportunity card.</div>':"")}
function storyHTML(st){return '<article class="story"><div class="tag">'+(st.category?esc(st.category.replace(/-/g," ")):(st.id.startsWith("ambition")?"The long mystery":"A story of "+esc(PLACES[state.place].name)))+'</div><h2>'+esc(st.title)+'</h2><p>'+esc(st.description)+'</p>'+choiceHTML(st,false)+'</article>'}
function renderMap(){return '<div class="hero"><div class="eyebrow">Cartography of the buried</div><h1>The city map</h1><p>All districts are shown, even those you have not yet reached. You can travel only to connected districts. Start in Lantern Court, take one of its roads, and follow the return route when you wish to go elsewhere. Travel is free.</p></div><div class="mapgrid">'+Object.entries(PLACES).filter(([k])=>!["cell","watch","ward","tribunal"].includes(k)).map(([id,p])=>{let locked=p.unlock&&!p.unlock(state),here=id===state.place,near=PLACES[state.place].adj.includes(id),can=state.stage==="explore"&&!locked&&near;return '<div class="maptile '+(here?"here":"")+'"><div class="eyebrow">'+(here?"✦ You are here":locked?"⛓ Not yet accessible":can?"↗ Direct route":"District")+'</div><h3>'+esc(p.name)+'</h3><p>'+esc(p.subtitle)+'. '+esc(p.desc)+'</p><p class="mapnote">'+(locked?esc(p.locked):can?"Connected to "+esc(PLACES[state.place].name):here?"Current district":"Connections: "+p.adj.map(x=>PLACES[x].name).join(" · "))+'</p>'+(!here?'<button class="btn outline tiny" data-act="travel" data-target="'+id+'" '+(!can?"disabled":"")+'>'+(locked?"Locked":can?"Travel here →":"Take a connecting road")+'</button>':'<span class="sticker">Your location</span>')+'</div>'}).join("")+'</div>'}
function renderMyself(){return '<div class="hero"><div class="eyebrow">You, as the city understands you</div><h1>Myself</h1><p>Once '+esc(state.background||"unknown")+', now a citizen of the Undercity by accident. '+(state.faction?'Your first allegiance is to '+esc(FACTIONS[state.faction][0])+'.':'Your story has not yet begun.')+'</p></div><div class="two"><section class="story"><h2>Abilities</h2><p class="small">Levels grow from change points. Difficult choices train the abilities you use.</p>'+Object.entries(STATS).map(([k,v])=>'<div class="statline"><span>'+v+'</span><strong>'+lv(state.stats[k])+' <small>('+state.stats[k]+' CP)</small></strong></div>').join("")+'</section><section class="story"><h2>Faction relations</h2>'+Object.entries(FACTIONS).map(([k,v])=>'<div class="statline"><span>'+esc(v[0])+'</span><strong>'+state.relation[k]+'</strong></div>').join("")+'</section></div><section class="story"><h2>The main ambition</h2><p>Who sealed the city? Stage '+state.ambition+' of 4. Leads gathered: '+state.clues+'.</p><div class="meter"><b style="width:'+state.ambition*25+'%"></b></div>'+(state.flags.remember?box("World changed","You let the Undercity remember its buried history."):state.flags.silence?box("World changed","You chose to keep the oldest silence."):box("Unfinished business","Your choices shape the city's memory and your reputation."))+'</section>'}
function renderPossessions(){let own=Object.entries(state.items).filter(x=>x[1]>0);return '<div class="hero"><div class="eyebrow">Everything you can carry</div><h1>Possessions</h1><p>Small objects have a habit of outliving their owners. Your inventory persists in this browser.</p></div><div class="story"><h2>Your satchel · '+own.length+' kinds of item</h2>'+(own.map(([k,v])=>'<div class="statline"><span>'+esc(ITEMS[k]||k)+'</span><strong>× '+v+'</strong></div>').join("")||'<p>Your satchel is empty. Explore and make bargains to acquire objects.</p>')+'</div><div class="story"><h2>Currency</h2><p>'+state.coin+' pennies. The Glass Arcade sells items and leads; other districts offer work.</p></div>'}
function renderJournal(){return '<div class="hero"><div class="eyebrow">The chronicle</div><h1>Your journal</h1><p>Choices have consequences, even when the city would prefer you to forget. Your most recent 80 entries are stored locally.</p></div>'+(state.journal.length?state.journal.map(l=>'<div class="log">'+esc(l.text)+'<small>'+esc(PLACES[l.place]?.name||"Undercity")+' · '+new Date(l.date).toLocaleString()+'</small></div>').join(""):'<div class="empty">No entries yet. Your first decision will be remembered.</div>')}
function renderBazaar(){return '<div class="hero"><div class="eyebrow">The strange economy</div><h1>Bazaar</h1><p>Spend pennies for useful goods, or earn them through stories. There is no premium currency.</p></div><div class="story"><h2>The travelling stall</h2><p>You need not stand in the Glass Arcade to buy basics. More curious bargains await in its storylets.</p>'+[["A proper meal",3,"health",2],["A calming infusion",4,"sanity",2],["A discreet favour",6,"suspicion",-2],["A clean reputation",6,"notoriety",-2]].map((x,i)=>'<button class="choice" data-act="shop" data-index="'+i+'" '+(state.coin<x[1]?"disabled":"")+'><b>'+x[0]+' · '+x[1]+' pennies</b><span class="detail">'+(x[3]>0?"+":"")+x[3]+" "+x[2]+'</span></button>').join("")+'</div>'}
function shop(i){let stuff=[["A proper meal",3,"health",2],["A calming infusion",4,"sanity",2],["A discreet favour",6,"suspicion",-2],["A clean reputation",6,"notoriety",-2]][i];if(!stuff||state.coin<stuff[1])return;state.coin-=stuff[1];apply({[stuff[2]]:stuff[3]});state.result={title:stuff[0],text:"The merchant exchanges a short nod with a less-than-short receipt.",note:"Purchased for "+stuff[1]+" pennies"};state.tab="story";addJournal("Bought "+stuff[0]);penalty();done()}
function renderHelp(){return '<div class="hero"><div class="eyebrow">A traveller’s guide</div><h1>How to play</h1><p>Your first journey is about getting somewhere, finding things to do there, and understanding why the city has concealed its past.</p></div><section class="story"><h2>1. Find your way</h2><p>Use the city map to see every district and its connections. The sidebar shows roads leading directly from your current location. Lantern Court connects to five starting districts. The Forgotten Stairs unlock after two leads, and the Listening Edge after four.</p><h2>2. Make a choice</h2><p>Each story gives you several clear options. A choice usually costs one action. A challenge shows which skill it tests and your chance of success before you commit. Failure can hurt, but the story continues.</p><h2>3. Follow two kinds of story</h2><p>The city-wide mystery has four stages. Your separate personal ambition has eight chapters; four seven-stage Making Your Name arcs run alongside independent encounters; investigate them in any order to earn pennies, clues, items and allies.</p><h2>4. Use opportunity cards</h2><p>Cards offer unexpected stories. You begin with two, gain a free one every four minutes, and can hold up to six. You may also buy an extra draw.</p><h2>5. Watch your condition</h2><p>Health and Sanity start at ten and must stay above zero. Suspicion and Notoriety start at zero and become dangerous at eight. A setback sends you to a recovery location, never a permanent game over.</p><h2>6. Save your journey</h2><p>Progress saves automatically to your browser. Settings includes an export, import and optional playtest mode. No account is required.</p></section>'}
function renderPaths(){
 const chosen=EXT.ambitions?.find(p=>p.id===state.path);
 let html='<div class="hero"><div class="eyebrow">Lives, careers and possible futures</div><h1>Paths & callings</h1><p>Four parallel reputations can grow, but only one personal ambition, profession and destiny may be held in a saved life.</p></div>';
 html+='<section class="story"><h2>Your personal ambition</h2>'+(chosen?
 '<p><strong>'+esc(chosen.name)+'</strong> · '+state.pathProgress+'/8 chapters completed.</p><p>'+esc(chosen.description)+'</p>'+
 (state.pathProgress<8?(()=>{const n=STORIES.find(x=>x.id==="path-"+chosen.id+"-"+(state.pathProgress+1));return n?'<p><strong>Next:</strong> '+esc(n.title)+' in <strong>'+esc(PLACES[n.where[0]]?.name)+'</strong>. Use the city map to travel there. Collect four leads to unlock the Edge.</p>':'';})():'<p>Ending: '+esc(state.pathEnding)+'. This choice is permanent in this saved life.</p>'):
 '<p>Choose one of four ambitions from <strong>A question no clerk can answer</strong> in Lantern Court. This is separate from your city-wide investigation.</p>')+'</section>';
 html+='<section class="story"><h2>Making Your Name</h2><p>Each ability has a seven-stage reputation storyline. You can follow all four, earning a different keepsake at the end.</p>'+
 (EXT.makingNames||[]).map(a=>{const v=state.renown[a.stat]||0,n=STORIES.find(x=>x.id==="name-"+a.stat+"-"+(v+1));return '<div class="statline"><span>'+esc(a.name)+' <small>('+esc(labelStat(a.stat))+')</small>'+(n?'<small>Next: '+esc(PLACES[n.where[0]].name)+'</small>':'<small>Complete · keepsake earned</small>')+'</span><strong>'+v+'/7</strong></div>';}).join('')+'</section>';
 const job=PROFESSIONS.find(p=>p.id===state.profession);
 html+='<section class="story"><h2>Profession</h2><p>'+(job?'You work as a <strong>'+esc(job.name)+'</strong>, earning '+job.wage+' pennies each seven days. Work story at '+esc(PLACES[job.place]?.name)+'.':'Choose a Tier 1 profession. Work to earn extra pennies, then pursue four stages of the appropriate Making Your Name quest to qualify for Tier 2.')+'</p>';
 html+=PROFESSIONS.map(p=>{const can=p.tier===1?!state.profession:!!job&&(state.renown[p.stat]||0)>=4&&job.tier===1;
 return '<button class="choice" data-act="profession" data-target="'+esc(p.id)+'" '+(!can?'disabled':'')+'><b>'+esc(p.name)+(p.id===state.profession?' ✓':'')+' · Tier '+p.tier+'</b><span class="detail">'+esc(labelStat(p.stat))+' · '+p.wage+' pennies/week · '+esc(p.scene)+(p.tier===2?' · Requires stage 4 '+esc(labelStat(p.stat))+' reputation':'')+'</span></button>';}).join('')+'</section>';
 html+='<section class="story"><h2>Destiny</h2><p>Choose one Ordinary Destiny after finishing the city investigation, or finish your personal ambition as well to qualify for Greater Destinies. Your decision is permanent.</p>';
 html+=DESTINIES.map(d=>{const can=!state.destiny&&state.ambition>=4&&(d.tier==='ordinary'||state.pathProgress>=8);
 return '<button class="choice" data-act="destiny" data-target="'+esc(d.id)+'" '+(!can?'disabled':'')+'><b>'+esc(d.name)+(d.id===state.destiny?' ✓':'')+' · '+esc(d.tier)+'</b><span class="detail">'+esc(d.description)+'</span></button>';}).join('')+'</section>';
 html+='<section class="story"><h2>Character quirks</h2><p>Earn these through decisions in different districts.</p>'+
 (EXT.quirks||[]).map(q=>'<div class="statline"><span>'+esc(q.name)+'</span><strong>'+(state.quirks[q.id]||0)+'</strong></div>').join('')+'</section>';
 html+='<section class="story"><h2>Exceptional stories</h2><p>Three original, self-contained three-stage mysteries with their own consequences.</p>'+
 (EXT.exceptionalStories||[]).map(x=>'<div class="statline"><span>'+esc(x.name)+'</span><strong>'+(state.extras[x.id]||0)+'/'+x.stages+'</strong></div>').join('')+'</section>';
 return html;
}
function hireProfession(id){
 const p=PROFESSIONS.find(x=>x.id===id),current=PROFESSIONS.find(x=>x.id===state.profession);
 if(!p||state.stage!=="explore"||(p.tier===1&&state.profession)||(p.tier===2&&(!current||current.tier!==1||(state.renown[p.stat]||0)<4)))return;
 state.profession=id;state.lastWage=Date.now();state.items[p.item]=(state.items[p.item]||0)+1;
 state.relation[p.faction]=(state.relation[p.faction]||0)+1;
 state.result={title:"A new profession: "+p.name,text:"Your weekly pay is "+p.wage+" pennies. "+p.scene+" Find your repeatable work story in "+PLACES[p.place].name+".",note:"A lasting calling"};
 addJournal("Became "+p.name);state.tab="story";done();
}
function claimDestiny(id){
 const d=DESTINIES.find(x=>x.id===id);
 if(!d||state.destiny||state.stage!=="explore"||state.ambition<4||(d.tier==="greater"&&state.pathProgress<8))return;
 state.destiny=id;state.coin+=d.bonus;state.relation[d.faction]=(state.relation[d.faction]||0)+3;
 state.result={title:"Your destiny: "+d.name,text:d.description+" The choice remains with this character.",note:"A destiny chosen"};
 addJournal("Chose destiny: "+d.name);state.tab="story";done();
}
function renderSettings(){return '<div class="hero"><div class="eyebrow">The experimental machinery</div><h1>Settings</h1><p>This is a local-save game. Saves remain on this device unless you export the JSON file yourself.</p></div><div class="story"><h2>Playtest mode</h2><p>When enabled, actions and paid card draws are free so you can inspect every branch and location without waiting. Story costs, risks and rewards remain visible. Return to normal mode at any time.</p><button class="btn '+(state.playtest?"":"outline")+'" data-act="playtest">'+(state.playtest?"Disable playtest mode":"Enable playtest mode")+'</button><div class="rule"></div><h2>Reading size</h2><div class="row"><button class="btn outline tiny" data-act="font" data-target="smaller">A−</button><button class="btn outline tiny" data-act="font" data-target="larger">A+</button></div><div class="rule"></div><h2>Back up or reset</h2><div class="row"><button class="btn outline tiny" data-act="export">Export save JSON</button><button class="btn outline tiny" data-act="import">Import save JSON</button><button class="btn outline tiny" data-act="reset">Restart game</button></div><input id="savefile" type="file" accept="application/json,.json" style="display:none"></div>'}
function render(){tick();renderTop();renderNav();renderMenaces();renderHand();const fn={story:renderStory,map:renderMap,myself:renderMyself,paths:renderPaths,possessions:renderPossessions,journal:renderJournal,bazaar:renderBazaar,help:renderHelp,settings:renderSettings}[state.tab]||renderStory;$("main").innerHTML=fn()}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b)return;let a=b.dataset.act,v=b.dataset.target;switch(a){case"intro":state.stage="origin";state.tutorial=true;done();break;case"skip":state.stage="origin";state.tutorial=false;done();break;case"origin":beginOrigin(v);break;case"faction":beginFaction(v);break;case"escape":escapeCell(v);break;case"tab":setTab(v);break;case"travel":travel(v);break;case"choose":choose(b.dataset.target,+b.dataset.index,b.dataset.card==="1");break;case"card":chooseCard(v);break;case"dismiss":state.result=null;state.selectedCard=null;done();break;case"recover":recover();break;case"profession":hireProfession(v);break;case"destiny":claimDestiny(v);break;case"shop":shop(+b.dataset.index);break;case"draw":buyDraw();break;case"playtest":state.playtest=!state.playtest;done();break;case"menu":{let open=$("left").classList.toggle("mobile-open");b.setAttribute("aria-expanded",String(open));break}case"font":{let size=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--font"))||1;size=Math.max(.85,Math.min(1.35,size+(v==="larger"?.1:-.1)));document.documentElement.style.setProperty("--font",size+"rem");break}case"export":{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="undercity-save.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);break}case"import":$("savefile").click();break;case"reset":if(confirm("Restart The Undercity? Your current local progress will be erased. Export a save first if you want to keep it.")){state=fresh();done()}break}});
document.addEventListener("change",e=>{if(e.target.id!=="savefile")return;let file=e.target.files[0];if(!file)return;file.text().then(t=>{let data=JSON.parse(t);if(data.version!==1||!data.stats||!PLACES[data.place]||!Array.isArray(data.hand))throw Error("Unrecognised save format");if(confirm("Replace your current local save with this imported journey?")){state=Object.assign(fresh(),data);state.result=null;done()}}).catch(err=>alert("Could not import save: "+err.message));e.target.value=""});
tick();save();render();setInterval(()=>{let a=state.actions,h=state.hand.length;tick();if(a!==state.actions||h!==state.hand.length){save();render()}else{let el=$("countdown");if(el){let r=Math.max(0,REGEN-(Date.now()-state.lastTick));el.textContent="+"+String(Math.floor(r/60000)).padStart(2,"0")+":"+String(Math.floor(r%60000/1000)).padStart(2,"0")}}},1000);
window.UndercityDiagnostics={statLevel:lv,broadCheck:odds,locations:()=>Object.keys(PLACES),storyCount:STORIES.length,cardCount:CARDS.length,professionCount:PROFESSIONS.length,destinyCount:DESTINIES.length,saveVersion:1,
checkState:()=>({stage:state.stage,place:state.place,ambition:state.ambition,path:state.path,pathProgress:state.pathProgress,renown:{...state.renown},profession:state.profession,destiny:state.destiny})};
})();
</script></body></html>
